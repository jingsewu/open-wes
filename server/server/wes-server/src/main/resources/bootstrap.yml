spring:
  application:
    name: wes
  profiles:
    active: test
  # The AI draft stream budgets its model calls below this value so a clean SSE error
  # event can still reach the client; keep it above ai-plugin.stream-budget-ms.
  mvc:
    async:
      request-timeout: 180000
  cloud:
    nacos:
      config:
        server-addr: ${nacos.openwes.com:nacos.openwes.com}:${nacos.port:8848}
        prefix: ${spring.application.name}
        file-extension: yml
        namespace: ${spring.profiles.active}
        group: openwes
        username: nacos
        password: nacos
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
    database-change-log-table: l_change_log
    database-change-log-lock-table: l_change_log_lock
  ai:
    zhipuai:
      api-key: xxx
      chat.options.model: GLM-4-air
      chat.options.temperature: 0

    vectorstore:
      pinecone:
        apiKey: ${PINECONE_API_KEY:}
        environment: aped-4627-b74a
        index-name: chatbot
        project-id: 5k87fkv

  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

script-plugin:
  registry:
    mode: local

server:
  port: 9010

bean-searcher:
  params:
    pagination:
      maxAllowedSize: 100000
      maxAllowedOffset: 100000
      start: 1
      size: perPage

logging:
  level:
    cn.zhxu.bs: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env
          - scheduledtasks
          - threadpool
          - prometheus

  endpoint:
    health:
      show-details: always

pf4j:
  plugin:
    jar:
      dir: /plugins/wes/jar
    config:
      dir: /plugins/wes/config

worker:
  id: 2
